<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agente de Órdenes de Compra SAP</title>
    <style>
      :root {
        color-scheme: light dark;
        --fondo: #f6f7f9;
        --panel: #ffffff;
        --borde: #d9dde3;
        --texto: #16191d;
        --suave: #5b6672;
        --acento: #1d4ed8;
        --aviso-fondo: #fff6e0;
        --aviso-borde: #e0a93a;
        --error-fondo: #fdeceb;
        --error-borde: #c8372d;
        --ok: #1d7a44;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #11141a;
          --panel: #1a1f27;
          --borde: #2d3542;
          --texto: #e8ebef;
          --suave: #9aa5b1;
          --acento: #7aa2ff;
          --aviso-fondo: #39300f;
          --aviso-borde: #c69326;
          --error-fondo: #3a1b19;
          --error-borde: #e06a60;
          --ok: #5cc98a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--fondo);
        color: var(--texto);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px));
        background: var(--panel);
        border-bottom: 1px solid var(--borde);
      }
      header h1 { margin: 0; font-size: 16px; }
      header p { margin: 4px 0 0; font-size: 13px; color: var(--suave); }
      #estado { font-size: 12px; color: var(--suave); margin-top: 6px; }
      main {
        flex: 1;
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .atajos { display: flex; flex-wrap: wrap; gap: 6px; }
      .atajos button {
        font: inherit;
        font-size: 13px;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid var(--borde);
        background: var(--panel);
        color: var(--texto);
        cursor: pointer;
      }
      .atajos button:hover { border-color: var(--acento); color: var(--acento); }
      #conversacion { display: flex; flex-direction: column; gap: 12px; }
      .turno {
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .turno.usuario { border-left: 3px solid var(--acento); }
      .turno.confirmacion { background: var(--aviso-fondo); border-color: var(--aviso-borde); }
      .turno.error { background: var(--error-fondo); border-color: var(--error-borde); }
      .quien { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--suave); margin-bottom: 6px; }
      .texto { white-space: pre-wrap; overflow-wrap: anywhere; }
      .texto table { border-collapse: collapse; }
      .insignia {
        display: inline-block;
        margin-bottom: 8px;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        background: var(--aviso-borde);
        color: #1b1403;
      }
      details.llamada {
        margin-top: 8px;
        border: 1px solid var(--borde);
        border-radius: 8px;
        background: var(--fondo);
      }
      details.llamada > summary {
        cursor: pointer;
        padding: 7px 10px;
        font-size: 13px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: baseline;
      }
      .herramienta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
      .resumen { color: var(--suave); }
      .marca-ok { color: var(--ok); font-weight: 700; }
      .marca-falla { color: var(--error-borde); font-weight: 700; }
      details.llamada pre {
        margin: 0;
        padding: 10px;
        border-top: 1px solid var(--borde);
        overflow-x: auto;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      form {
        position: sticky;
        bottom: 0;
        display: flex;
        gap: 8px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        background: var(--panel);
        border-top: 1px solid var(--borde);
      }
      form > div { width: 100%; max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
      textarea {
        flex: 1;
        font: inherit;
        resize: vertical;
        min-height: 44px;
        max-height: 160px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--borde);
        background: var(--fondo);
        color: var(--texto);
      }
      button[type="submit"] {
        font: inherit;
        font-weight: 600;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: var(--acento);
        color: #fff;
        cursor: pointer;
      }
      button[disabled] { opacity: 0.55; cursor: progress; }
      #pensando { display: flex; align-items: center; gap: 8px; color: var(--suave); font-size: 14px; }
      #pensando .punto {
        width: 7px; height: 7px; border-radius: 50%; background: var(--acento);
        animation: latir 1s infinite ease-in-out;
      }
      #pensando .punto:nth-child(2) { animation-delay: 0.15s; }
      #pensando .punto:nth-child(3) { animation-delay: 0.3s; }
      @keyframes latir { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Agente de Órdenes de Compra SAP</h1>
      <p>Reto técnico 03 · Periferia IT Group — prepara, valida y crea órdenes de compra en un SAP simulado.</p>
      <div id="estado">Consultando estado del backend…</div>
    </header>

    <main>
      <div class="atajos" id="atajos"></div>
      <div id="conversacion"></div>
      <div id="pensando" hidden>
        <span class="punto"></span><span class="punto"></span><span class="punto"></span>
        <span>El agente está pensando y ejecutando herramientas…</span>
      </div>
    </main>

    <form id="formulario">
      <div>
        <textarea
          id="mensaje"
          rows="1"
          placeholder="Ej.: Procesa la solicitud sol-004. Muéstrame la OC como quedaría en SAP y no la crees hasta que yo lo confirme."
          autocomplete="off"
        ></textarea>
        <button type="submit" id="enviar">Enviar</button>
      </div>
    </form>

    <script>
      const sessionId = `web-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`
      const conversacion = document.getElementById("conversacion")
      const pensando = document.getElementById("pensando")
      const formulario = document.getElementById("formulario")
      const entrada = document.getElementById("mensaje")
      const botonEnviar = document.getElementById("enviar")
      const estado = document.getElementById("estado")
      const atajos = document.getElementById("atajos")

      function elemento(etiqueta, clase, texto) {
        const nodo = document.createElement(etiqueta)
        if (clase) nodo.className = clase
        if (texto !== undefined) nodo.textContent = texto
        return nodo
      }

      function pintarTurno({ quien, texto, clase, insignia, toolCalls }) {
        const turno = elemento("article", `turno ${clase ?? ""}`.trim())
        turno.append(elemento("div", "quien", quien))
        if (insignia) turno.append(elemento("span", "insignia", insignia))
        if (texto) turno.append(elemento("div", "texto", texto))
        for (const llamada of toolCalls ?? []) {
          const detalle = elemento("details", "llamada")
          const resumen = elemento("summary")
          resumen.append(elemento("span", llamada.ok ? "marca-ok" : "marca-falla", llamada.ok ? "✓" : "✗"))
          resumen.append(elemento("span", "herramienta", llamada.nombre))
          resumen.append(elemento("span", "resumen", llamada.resumen))
          detalle.append(resumen)
          detalle.append(
            elemento(
              "pre",
              null,
              `argumentos:\n${JSON.stringify(llamada.argumentos, null, 2)}\n\nresultado:\n${JSON.stringify(llamada.resultado, null, 2)}`,
            ),
          )
          turno.append(detalle)
        }
        conversacion.append(turno)
        turno.scrollIntoView({ behavior: "smooth", block: "end" })
      }

      async function cargarEstado() {
        try {
          const salud = await (await fetch("/api/health")).json()
          estado.textContent = salud.llm_configurado
            ? `Backend activo · proveedor ${salud.provider} · modelo ${salud.model} · tope ${salud.limites.iteracionesPorTurno} iteraciones/turno · herramientas: ${salud.herramientas.join(", ")}`
            : `Backend activo SIN modelo: ${salud.motivo_llm}`
          if (!salud.llm_configurado) {
            pintarTurno({
              quien: "Sistema",
              clase: "error",
              texto: `El chat con modelo real está deshabilitado: ${salud.motivo_llm}`,
            })
          }
          const casos = (await (await fetch("/api/casos")).json()).casos ?? []
          for (const caso of casos) {
            const boton = elemento("button", null, `Procesar ${caso}`)
            boton.type = "button"
            boton.addEventListener("click", () => {
              entrada.value = `Procesa la solicitud "${caso}". Muéstrame la OC como quedaría en SAP, qué validaciones pasó y cuáles no, y no la crees hasta que yo lo confirme.`
              entrada.focus()
            })
            atajos.append(boton)
          }
        } catch (causa) {
          estado.textContent = `No se pudo consultar /api/health: ${causa.message}`
        }
      }

      async function enviar(mensaje) {
        pintarTurno({ quien: "Analista", clase: "usuario", texto: mensaje })
        pensando.hidden = false
        botonEnviar.disabled = true
        try {
          const respuesta = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ sessionId, message: mensaje }),
          })
          const datos = await respuesta.json()
          if (!datos.ok) {
            pintarTurno({ quien: "Agente", clase: "error", texto: `No pude completar el turno: ${datos.error}` })
            return
          }
          pintarTurno({
            quien: "Agente",
            clase: datos.needsConfirmation ? "confirmacion" : "",
            insignia: datos.needsConfirmation ? "⚠ Esperando su confirmación" : null,
            texto: datos.reply,
            toolCalls: datos.toolCalls,
          })
        } catch (causa) {
          pintarTurno({ quien: "Agente", clase: "error", texto: `Error de red hacia el backend: ${causa.message}` })
        } finally {
          pensando.hidden = true
          botonEnviar.disabled = false
          entrada.focus()
        }
      }

      formulario.addEventListener("submit", (evento) => {
        evento.preventDefault()
        const mensaje = entrada.value.trim()
        if (mensaje === "") return
        entrada.value = ""
        enviar(mensaje)
      })

      entrada.addEventListener("keydown", (evento) => {
        if (evento.key === "Enter" && !evento.shiftKey) {
          evento.preventDefault()
          formulario.requestSubmit()
        }
      })

      cargarEstado()
    </script>
  </body>
</html>
